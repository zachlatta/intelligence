name: CI
on:
  push:
    branches: [main]
  pull_request:
# The repository is public: workflows get a read-only token and no secrets.
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make test
  # Secrets anywhere in history, not only in the files internal/hygiene checks.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks over every commit
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          curl -sSfLo gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v$VERSION/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "$SHA256  gl.tgz" | sha256sum -c -
          tar -xzf gl.tgz gitleaks && rm gl.tgz
          ./gitleaks git . --no-banner --redact --log-opts=--all 2>&1 | tee gitleaks.log
          # a scan of no commits is a broken scan, not a clean one
          grep -Eq '[1-9][0-9]* commits scanned' gitleaks.log
